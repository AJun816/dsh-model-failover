# dsh-glm-suite bundle patch
# web 行：把内置 web_search / web_fetch 的后端指到本插件注册的智谱 provider：
#   searchProvider → zhipu-official（web_search_prime 套餐 MCP，多 key 轮换）
#   fetchProvider  → zhipu-reader（webReader 套餐 MCP；key 池全耗尽时本地 http 兜底）
# 插件行：注册 glm_zread_* 三件仓库工具（zread 套餐 MCP，默认开启）。
# 视觉理解 MCP（本地 stdio @z_ai/mcp-server）请经官方 dsh-mcp-client 挂载，见 README。
# 注意：若把下方 search/fetch 开关关掉，patch 的钉选仍在——web 工具会显式报
# provider 不可用（不静默回落 DeepSeek 计费），这是有意设计。
- id: web
  config:
    searchProvider: zhipu-official
    fetchProvider: zhipu-reader
- insert:
    - id: glm-suite
      name: dsh-glm-suite
      config:
        apiKeyEnvs:
          - ZAI_CODING_CN_API_KEY
          - ZAI_CODING_CN_2_API_KEY
          - ZAI_CODING_CN_3_API_KEY
        contentSize: medium
        recencyFilter: noLimit
        location: cn
